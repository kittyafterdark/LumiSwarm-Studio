<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swarm Studio UI Harness</title>
  <style>
    :root {
      --lumiverse-fill: #16191f;
      --lumiverse-fill-subtle: #20242d;
      --lumiverse-border: #363c49;
      --lumiverse-text: #eef2f6;
      --lumiverse-text-muted: #9da8b8;
      --lumiverse-text-dim: #727d8c;
      --lumiverse-accent: #72d6d0;
      --lumiverse-accent-text: #061716;
      --lumiverse-radius: 9px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0e1116; color: var(--lumiverse-text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .host-modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: rgba(4, 7, 10, .72); }
    .host-dialog { width: min(1120px, calc(100vw - 36px)); max-height: calc(100vh - 36px); overflow: hidden; border: 1px solid #3c4452; border-radius: 13px; background: rgba(20, 23, 29, .97); box-shadow: 0 30px 90px rgba(0,0,0,.55); }
    .host-header { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--lumiverse-border); }
    .host-header strong { font-size: 14px; }
    .host-header button { border: 0; background: transparent; color: var(--lumiverse-text-muted); font-size: 22px; }
    .host-body { padding: 13px; overflow: hidden; }
    .host-widget { position: fixed; right: 18px; bottom: 18px; z-index: 80; }
    #drawer { display: none; }
  </style>
</head>
<body>
  <div id="drawer"></div>
  <script type="module">
    import { setup } from "../dist/frontend.js"

    const handlers = []
    const later = (payload) => setTimeout(() => handlers.forEach((handler) => handler(payload)), 0)
    const svg = (label, a, b) => `data:image/svg+xml,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
        <rect width="640" height="640" fill="url(#g)"/>
        <circle cx="320" cy="275" r="154" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="4"/>
        <path d="M165 500c55-105 255-105 310 0" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="4"/>
        <text x="320" y="580" text-anchor="middle" fill="white" font-family="system-ui" font-size="28">${label}</text>
      </svg>
    `)}`

    const loras = [
      { name: "anima/cinematic-ink.safetensors", title: "Cinematic Ink · Anima", author: "Nox Atelier", description: "Graphic inkwork trained for Anima with controlled lighting and confident line weight.", previewRef: "/preview/ink", architecture: "anima-v1/lora", className: "LoRA", compatClass: "anima-v1", triggerPhrase: "cinematic ink style", tags: ["anima", "style"], defaultWeight: .8, local: true, timeModified: 8 },
      { name: "anima/soft-portrait.safetensors", title: "Soft Portrait · Anima", author: "Mira", description: "Natural portrait rendering with soft detail and gentle falloff.", previewRef: "/preview/portrait", architecture: "anima-v1/lora", className: "LoRA", compatClass: "anima-v1", triggerPhrase: "soft portrait lighting", tags: ["anima", "portrait"], defaultWeight: .65, local: true, timeModified: 7 },
      { name: "anima/neon-rim.safetensors", title: "Neon Rim · Anima", author: "Chromaforge", description: "Cyan and magenta rim lighting tuned for Anima checkpoints.", previewRef: "/preview/neon", architecture: "anima-v1/lora", className: "LoRA", compatClass: "anima-v1", triggerPhrase: "neon rim lighting", tags: ["anima", "lighting"], defaultWeight: .55, local: true, timeModified: 9 },
      { name: "illustrious/analog-editorial.safetensors", title: "Analog Editorial · Illustrious", author: "Frame 36", description: "An Illustrious-only editorial film style.", previewRef: "/preview/analog", architecture: "illustrious/lora", className: "LoRA", compatClass: "illustrious-v1", triggerPhrase: "analog editorial photo", tags: ["illustrious", "photo"], defaultWeight: .7, local: true, timeModified: 5 },
      { name: "illustrious/crystal-bloom.safetensors", title: "Crystal Bloom · Illustrious", author: "Arca", description: "Illustrious crystalline floral growth patterns.", previewRef: "/preview/crystal", architecture: "illustrious/lora", className: "LoRA", compatClass: "illustrious-v1", triggerPhrase: "crystal bloom", tags: ["illustrious", "concept"], defaultWeight: .9, local: true, timeModified: 6 },
      { name: "utility/detail-helper.safetensors", title: "Unclassified Detail Helper", author: "Local", description: "No compatibility metadata, so it remains visible as an unclassified model.", previewRef: null, architecture: "", className: "LoRA", compatClass: "", triggerPhrase: "", tags: ["utility"], defaultWeight: .4, local: true, timeModified: 4 },
    ]
    const previewMap = {
      "anima/cinematic-ink.safetensors": svg("Cinematic Ink", "#182437", "#9b5948"),
      "anima/soft-portrait.safetensors": svg("Soft Portrait", "#bc7b78", "#4d3565"),
      "anima/neon-rim.safetensors": svg("Neon Rim", "#102847", "#b11a85"),
      "illustrious/analog-editorial.safetensors": svg("Analog Editorial", "#806241", "#2d5049"),
      "illustrious/crystal-bloom.safetensors": svg("Crystal Bloom", "#543f82", "#188f8b"),
    }
    const palette = [
      ["#134e5e", "#6f3f78"],
      ["#3f2b55", "#9a6854"],
      ["#123c50", "#32746d"],
      ["#653b49", "#1f5360"],
    ]
    let historyOutputs = Array.from({ length: 32 }, (_, index) => {
      const number = 32 - index
      const colors = palette[index % palette.length]
      const source = svg(`Output ${number}`, colors[0], colors[1])
      return {
        id: `image-${number}`,
        url: source,
        original_filename: `swarm-output-${number}.png`,
        studioMetadata: {
          prompt: `portrait ${number}, cinematic ink style`,
          negativePrompt: "blurry, low quality",
          resolvedPrompt: `cinematic lighting, portrait ${number}, cinematic ink style`,
          resolvedNegativePrompt: "blurry, low quality, flat lighting",
          model: "anima-semi-v10.safetensors",
          parameters: {
            width: number % 3 === 0 ? 768 : 1024,
            height: number % 3 === 0 ? 1152 : 1024,
            steps: 28,
            cfgScale: 4.5,
            seed: 4000 + number,
            sampler: "dpmpp_2m",
            scheduler: "beta57",
          },
          loras: [{ name: "anima/cinematic-ink.safetensors", weight: .8 }],
          presets: ["Cinematic"],
          timing: { totalMs: 2100, prep: "0.24 sec", generation: "1.86 sec", source: "swarm" },
          swarmPath: `2026-07-19/swarm-output-${number}.png`,
          createdAt: Date.now() - index * 60_000,
        },
      }
    })
    let outputFolders = [{
      id: "favorites",
      name: "Favorites",
      imageIds: ["image-32", "image-29", "image-24"],
      updatedAt: Date.now(),
    }]

    const drawerRoot = document.querySelector("#drawer")
    const ctx = {
      dom: {
        addStyle(css) {
          const style = document.createElement("style")
          style.textContent = css
          document.head.appendChild(style)
          return () => style.remove()
        },
      },
      ui: {
        showModal({ title }) {
          const host = document.createElement("div")
          host.className = "host-modal"
          host.innerHTML = `<div class="host-dialog"><div class="host-header"><strong></strong><button aria-label="Close">×</button></div><div class="host-body"></div></div>`
          host.querySelector("strong").textContent = title
          document.body.appendChild(host)
          const dismissHandlers = []
          const handle = {
            root: host.querySelector(".host-body"),
            setTitle(value) { host.querySelector("strong").textContent = value },
            onDismiss(handler) { dismissHandlers.push(handler); return () => {} },
            dismiss() { host.remove(); dismissHandlers.forEach((handler) => handler()) },
          }
          host.querySelector("button").addEventListener("click", () => handle.dismiss())
          return handle
        },
        registerDrawerTab() {
          const root = document.createElement("div")
          drawerRoot.appendChild(root)
          return { root, destroy() {}, onActivate() { return () => {} } }
        },
        registerInputBarAction() {
          let clickHandler = () => {}
          return { onClick(handler) { clickHandler = handler; return () => { clickHandler = () => {} } }, destroy() {} }
        },
        mountApp() {
          const root = document.createElement("div")
          document.body.appendChild(root)
          return {
            root,
            setVisible(value) { root.hidden = !value },
            destroy() { root.remove() },
          }
        },
        createFloatWidget(options = {}) {
          const root = document.createElement("div")
          root.className = "host-widget"
          root.style.width = `${options.width || 318}px`
          root.style.height = `${options.height || 94}px`
          document.body.appendChild(root)
          return {
            root,
            setSize(width, height) {
              root.style.width = `${width}px`
              root.style.height = `${height}px`
            },
            setVisible(value) { root.hidden = !value },
            isVisible() { return !root.hidden },
            destroy() { root.remove() },
          }
        },
      },
      onBackendMessage(handler) { handlers.push(handler); return () => {} },
      events: { on() { return () => {} } },
      sendToBackend(message) {
        if (message.type === "bootstrap") {
          later({ type: "bootstrap_result", requestId: message.requestId, data: {
            permissions: { imageGen: true, metadata: true, images: true, chats: true },
            connections: [{ id: "swarm-1", name: "Local SwarmUI", provider: "swarmui", api_url: "http://127.0.0.1:7801", model: "anima-semi-v10.safetensors", is_default: true, default_parameters: { width: 768, height: 1152, steps: 28, cfgScale: 4.5, sampler: "dpmpp_2m", scheduler: "beta57" } }],
            outputs: historyOutputs.slice(0, 12),
            total: historyOutputs.length,
            offset: 0,
            limit: 12,
            outputFolders,
            stackPresets: [
              { id: "portrait-stack", name: "Anima portrait", updatedAt: Date.now(), items: [{ name: "anima/soft-portrait.safetensors", title: "Soft Portrait · Anima", weight: .65, enabled: true, useTrigger: false }] },
              { id: "ink-stack", name: "Ink + rim light", updatedAt: Date.now(), items: [{ name: "anima/cinematic-ink.safetensors", title: "Cinematic Ink · Anima", weight: .8, enabled: true, useTrigger: false }, { name: "anima/neon-rim.safetensors", title: "Neon Rim · Anima", weight: .55, enabled: true, useTrigger: false }] },
            ],
            activeChat: { id: "chat-1", character_id: "char-1" },
          }})
        } else if (message.type === "load_connection") {
          later({ type: "connection_result", requestId: message.requestId, data: {
            connection: { id: "swarm-1", name: "Local SwarmUI", model: "anima-semi-v10.safetensors", default_parameters: { width: 768, height: 1152, steps: 28, cfgScale: 4.5, sampler: "dpmpp_2m", scheduler: "beta57" } },
            models: [{ id: "anima-semi-v10.safetensors", label: "Anima Semi v1.0" }, { id: "illustrious-xl-v15.safetensors", label: "Illustrious XL v1.5" }],
            checkpoints: [
              { name: "anima-semi-v10.safetensors", title: "Anima Semi v1.0", architecture: "anima-v1/base", className: "checkpoint", compatClass: "anima-v1" },
              { name: "illustrious-xl-v15.safetensors", title: "Illustrious XL v1.5", architecture: "illustrious/base", className: "checkpoint", compatClass: "illustrious-v1" },
            ],
            loras,
            swarmOptions: {
              samplers: ["euler", "dpmpp_2m", "dpmpp_2m_sde_gpu"],
              schedulers: ["normal", "karras", "beta57"],
              presets: [
                { title: "Cinematic", description: "Replaces prompts with a controlled movie-lighting baseline.", paramMap: { prompt: "cinematic lighting, anime portrait, masterpiece", negativeprompt: "flat lighting, blurry, low quality" } },
                { title: "Clean anime", description: "Replaces prompts with a crisp Anima baseline.", paramMap: { prompt: "clean anime linework, detailed portrait", negativeprompt: "messy lines, malformed anatomy" } },
              ],
              parameters: [
                { id: "prompt", name: "Prompt", type: "text", description: "" },
                { id: "negativeprompt", name: "Negative Prompt", type: "text", description: "" },
                { id: "model", name: "Model", type: "model", description: "" },
                { id: "width", name: "Width", type: "integer", description: "" },
                { id: "height", name: "Height", type: "integer", description: "" },
                { id: "steps", name: "Steps", type: "integer", description: "" },
                { id: "cfgscale", name: "CFG Scale", type: "decimal", description: "" },
                { id: "seed", name: "Seed", type: "integer", description: "" },
                { id: "sampler", name: "Sampler", type: "dropdown", description: "" },
                { id: "scheduler", name: "Scheduler", type: "dropdown", description: "" },
              ],
              canManagePresets: true,
              workflows: [
                { name: "Studio/Inpaint Detail", image: "/workflow/inpaint", description: "Inpaint and detail pass with exposed mask, denoise, and finishing controls.", enableInSimple: true },
                { name: "Studio/Upscale Polish", image: "/workflow/upscale", description: "Two-pass upscale and polish workflow.", enableInSimple: true },
              ],
              workflowError: "",
            },
            metadataError: "",
            hasMetadataToken: false,
          }})
        } else if (message.type === "preview") {
          later({ type: "preview_result", requestId: message.requestId, name: message.name, dataUrl: previewMap[message.name] })
        } else if (message.type === "load_swarm_workflow") {
          later({ type: "swarm_workflow_result", requestId: message.requestId, data: {
            name: message.name,
            image: "/workflow/inpaint",
            description: "Inpaint and detail pass with exposed mask, denoise, and finishing controls.",
            enableInSimple: true,
            parameters: [
              { id: "prompt", name: "Prompt", type: "text", description: "", default: "", values: [], viewType: "prompt", min: null, max: null, step: null, visible: true, toggleable: false, advanced: false, imageAlwaysBase64: false, group: null },
              { id: "negativeprompt", name: "Negative Prompt", type: "text", description: "", default: "", values: [], viewType: "prompt", min: null, max: null, step: null, visible: true, toggleable: false, advanced: false, imageAlwaysBase64: false, group: null },
              { id: "comfyrawworkflowinputdecimaldenoiseb", name: "Detail denoise", type: "decimal", description: "How freely the detail pass can redraw.", default: .42, values: [], viewType: "slider", min: 0, max: 1, step: .05, visible: true, toggleable: true, advanced: false, imageAlwaysBase64: false, group: { id: "detail-pass", name: "Detail pass", description: "Fine control over the second sampling pass.", open: true, advanced: false, canShrink: true, toggles: false } },
              { id: "comfyrawworkflowinputdropdownupscalerc", name: "Upscaler", type: "dropdown", description: "Model used for the finishing upscale.", default: "4x-UltraSharp", values: ["4x-UltraSharp", "RealESRGAN_x4plus"], viewType: "normal", min: null, max: null, step: null, visible: true, toggleable: false, advanced: false, imageAlwaysBase64: false, group: { id: "detail-pass", name: "Detail pass", description: "Fine control over the second sampling pass.", open: true, advanced: false, canShrink: true, toggles: false } },
              { id: "comfyrawworkflowinputintegerpassesd", name: "Finishing passes", type: "integer", description: "Additional finishing passes.", default: 1, values: [], viewType: "normal", min: 1, max: 4, step: 1, visible: true, toggleable: true, advanced: true, imageAlwaysBase64: false, group: { id: "finishing", name: "Finishing", description: "Optional final-stage controls.", open: false, advanced: true, canShrink: true, toggles: false } },
            ],
          }})
        } else if (message.type === "generate") {
          const generatedSource = svg("Generated now", "#134e5e", "#6f3f78")
          const rawOverride = JSON.parse(message.input.parameters.rawRequestOverride || "{}")
          const record = {
            prompt: message.input.prompt,
            negativePrompt: message.input.negativePrompt || "",
            resolvedPrompt: message.recordHints.resolvedPrompt,
            resolvedNegativePrompt: message.recordHints.resolvedNegativePrompt,
            model: message.input.model,
            parameters: { ...message.input.parameters, seed: 123456789 },
            loras: message.input.parameters.loras.map((name, index) => ({ name, weight: message.input.parameters.loraWeights[index] })),
            presets: message.recordHints.presets,
            workflow: message.recordHints.workflow || "",
            timing: { totalMs: 2340, prep: "0.27 sec", generation: "2.07 sec", source: "swarm" },
            swarmPath: "2026-07-19/generated-now.png",
            initImageId: message.recordHints.initImageId,
            initImageLabel: message.recordHints.initImageLabel,
            createdAt: Date.now(),
          }
          const generatedOutput = {
            id: "image-new",
            url: generatedSource,
            original_filename: "generated-now.png",
            studioMetadata: record,
          }
          historyOutputs = [generatedOutput, ...historyOutputs.filter((item) => item.id !== generatedOutput.id)]
          later({ type: "generation_started", clientJobId: message.input.clientJobId, data: { connectionId: message.input.connection_id, model: message.input.model } })
          setTimeout(() => later({ type: "generation_progress", clientJobId: message.input.clientJobId, data: {
            step: 9,
            totalSteps: 26,
            preview: generatedSource,
            workflow: rawOverride.comfyuicustomworkflow || "",
          }}), 90)
          setTimeout(() => later({ type: "generation_result", requestId: message.requestId, data: {
            result: { imageId: generatedOutput.id, imageDataUrl: generatedSource, imageUrl: generatedSource, model: "anima-semi-v10.safetensors", provider: "swarmui" },
            record,
            outputs: historyOutputs.slice(0, 12),
            total: historyOutputs.length,
            offset: 0,
            limit: 12,
          }}), 350)
        } else if (message.type === "refresh_outputs") {
          const offset = Number(message.offset) || 0
          const limit = Number(message.limit) || 12
          later({ type: "outputs_result", requestId: message.requestId, data: {
            outputs: historyOutputs.slice(offset, offset + limit),
            total: historyOutputs.length,
            offset,
            limit,
          }})
        } else if (message.type === "list_library_outputs") {
          later({ type: "library_outputs_result", requestId: message.requestId, data: {
            outputs: historyOutputs,
            total: historyOutputs.length,
            folders: outputFolders,
          }})
        } else if (message.type === "create_output_folder") {
          outputFolders = [{
            id: `folder-${Date.now()}`,
            name: message.name,
            imageIds: [],
            updatedAt: Date.now(),
          }, ...outputFolders]
          later({ type: "output_folders_result", requestId: message.requestId, data: outputFolders })
        } else if (message.type === "delete_output_folder") {
          outputFolders = outputFolders.filter((folder) => folder.id !== message.folderId)
          later({ type: "output_folders_result", requestId: message.requestId, data: outputFolders })
        } else if (message.type === "move_output_to_folder") {
          outputFolders = outputFolders.map((folder) => ({
            ...folder,
            imageIds: folder.id === message.folderId
              ? [message.imageId, ...folder.imageIds.filter((id) => id !== message.imageId)]
              : folder.imageIds.filter((id) => id !== message.imageId),
          }))
          later({ type: "output_folders_result", requestId: message.requestId, data: outputFolders })
        } else if (message.type === "bulk_move_outputs") {
          const selected = Array.isArray(message.imageIds) ? message.imageIds : []
          outputFolders = outputFolders.map((folder) => ({
            ...folder,
            imageIds: folder.id === message.folderId
              ? [...selected, ...folder.imageIds.filter((id) => !selected.includes(id))]
              : folder.imageIds.filter((id) => !selected.includes(id)),
          }))
          later({ type: "output_folders_result", requestId: message.requestId, data: outputFolders })
        } else if (message.type === "delete_output") {
          historyOutputs = historyOutputs.filter((output) => output.id !== message.imageId)
          outputFolders = outputFolders.map((folder) => ({
            ...folder,
            imageIds: folder.imageIds.filter((id) => id !== message.imageId),
          }))
          later({ type: "output_deleted", requestId: message.requestId, data: {
            imageId: message.imageId,
            folders: outputFolders,
            outputs: historyOutputs.slice(0, 12),
            total: historyOutputs.length,
            offset: 0,
            limit: 12,
          }})
        } else if (message.type === "bulk_delete_outputs") {
          const selected = Array.isArray(message.imageIds) ? message.imageIds : []
          historyOutputs = historyOutputs.filter((output) => !selected.includes(output.id))
          outputFolders = outputFolders.map((folder) => ({
            ...folder,
            imageIds: folder.imageIds.filter((id) => !selected.includes(id)),
          }))
          later({ type: "outputs_bulk_deleted", requestId: message.requestId, data: {
            deletedIds: selected,
            failedIds: [],
            folders: outputFolders,
            outputs: historyOutputs.slice(0, 12),
            total: historyOutputs.length,
            offset: 0,
            limit: 12,
          }})
        }
      },
    }

    setup(ctx)
    drawerRoot.querySelector("button").click()
  </script>
</body>
</html>
